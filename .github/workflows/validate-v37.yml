name: Valider HOOP LEGACY V3.7
on:
  push:
    branches: [work/hoop-legacy-v3.7]
permissions:
  contents: read
concurrency:
  group: hoop-v37-validation
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:v37-balance
      - name: Vérifier les deux campagnes de trente saisons du code publié
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const hash=crypto.createHash('sha256').update(['environment','finance','life-context','club-project','match-v34','statistics','career-plan','chapters','physical','engine','match','match-v33','match-v32','match-effects','world','life','progression','config','leagues','legacy','system','postseason','career-ledger','simulation','sport-events','commands'].map(n=>fs.readFileSync('dist/'+n+'.js','utf8')).join('')).digest('hex');
          for(const id of [2026,973]){const r=JSON.parse(fs.readFileSync('tests/long-run-'+id+'.json'));assert.equal(r.fingerprint,hash);assert.equal(r.checkpoints.length,30);}
          console.log('Deux campagnes de trente saisons, même code moteur. Alertes de domination conservées.');
          JS
      - name: Simulation indépendante de deux saisons
        run: QA_SEASONS=2 node tools/long-run.mjs 2026
      - name: Préparer Chromium et les versions précédentes
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
          fi
          mkdir -p .qa-previous30 .qa-previous31 .qa-previous32 .qa-previous33 .qa-previous34 .qa-previous35 .qa-previous36
          git archive 14feec00c981fe322ba3ec5f9f282ded578d33b8 dist | tar -x -C .qa-previous30
          git archive 0e11ed97d9723180ed48b5a9e9f2a94670ed6add dist | tar -x -C .qa-previous31
          git archive b2c13b45d698480fae5c4b6d1da5982f514037da dist | tar -x -C .qa-previous32
          git archive 1277a72d6ec10ed366ecbf0e1a417f4f6832f7f0 dist | tar -x -C .qa-previous33
          git archive 8a809d031ab51035c6670a5409ba3c14f1652761 dist | tar -x -C .qa-previous34
          git archive 1e38e7e847daa062ce4635ad10b6b416a1cf0295 dist | tar -x -C .qa-previous35
          git archive ce85a69df13a294be685555122ce4f2b5c09bf9e dist | tar -x -C .qa-previous36
      - run: npm run test:v37-neutrality
      - run: npm run test:browser
      - run: npm run test:v33-browser
      - run: npm run test:v35-browser
      - run: npm run test:v36-browser
      - run: npm run test:v37-browser
      - name: Migrations avec ancien cache actif
        run: |
          for version in 30 31 32 33 34 35 36; do
            QA_PREVIOUS_ROOT="$PWD/.qa-previous$version/dist" npm run test:upgrade
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-v37
          path: |
            test-results/
            tests/long-run-2026.json
            tests/v37-*.json
