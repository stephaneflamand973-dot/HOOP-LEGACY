name: Valider HOOP LEGACY V3.9
on:
  push:
    branches: [work/hoop-legacy-v3.9]
permissions:
  contents: read
concurrency:
  group: hoop-v39-validation
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Préparer Chromium et les neuf versions précédentes
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
          fi
          mkdir -p .qa-previous30 .qa-previous31 .qa-previous32 .qa-previous33 .qa-previous34 .qa-previous35 .qa-previous36 .qa-previous37 .qa-previous38
          git archive 14feec00c981fe322ba3ec5f9f282ded578d33b8 dist | tar -x -C .qa-previous30
          git archive 0e11ed97d9723180ed48b5a9e9f2a94670ed6add dist | tar -x -C .qa-previous31
          git archive b2c13b45d698480fae5c4b6d1da5982f514037da dist | tar -x -C .qa-previous32
          git archive 1277a72d6ec10ed366ecbf0e1a417f4f6832f7f0 dist | tar -x -C .qa-previous33
          git archive 8a809d031ab51035c6670a5409ba3c14f1652761 dist | tar -x -C .qa-previous34
          git archive 1e38e7e847daa062ce4635ad10b6b416a1cf0295 dist | tar -x -C .qa-previous35
          git archive ce85a69df13a294be685555122ce4f2b5c09bf9e dist | tar -x -C .qa-previous36
          git archive 6cea8a311ddd68d26cc9a94a13675355f59dc159 dist | tar -x -C .qa-previous37
          git archive c657ca01438fa000cebd9dd474ce445fa70ed614 dist | tar -x -C .qa-previous38
      - run: npm run test:v39-neutrality
      - run: npm run test:browser
      - run: npm run test:v33-browser
      - run: npm run test:v35-browser
      - run: npm run test:v36-browser
      - run: npm run test:v37-browser
      - run: npm run test:v38-browser
      - run: npm run test:v39-browser
      - name: Migrations avec ancien cache actif
        run: |
          for version in 30 31 32 33 34 35 36 37 38; do
            QA_PREVIOUS_ROOT="$PWD/.qa-previous$version/dist" npm run test:upgrade
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-v39
          path: |
            test-results/
            tests/v39-*.json
  economy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [2026, 973]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/v39-balance.mjs ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economy-v39-${{ matrix.seed }}
          path: tests/v39-balance-${{ matrix.seed }}.json
  long-career:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [2026, 973]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Campagne indépendante de trente saisons
        run: node tools/long-run.mjs ${{ matrix.seed }}
      - name: Vérifier l’empreinte du rapport généré
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const hash=crypto.createHash('sha256').update(['representation','representation-state','representation-catalog','negotiation','negotiation-rules','collective','collective-state','collective-catalog','collective-match','match-v35','environment','finance','life-context','club-project','match-v34','statistics','career-plan','chapters','physical','engine','match','match-v33','match-v32','match-effects','world','life','progression','config','leagues','legacy','system','postseason','career-ledger','simulation','sport-events','commands'].map(n=>fs.readFileSync('dist/'+n+'.js','utf8')).join('')).digest('hex');
          for(const seed of [${{ matrix.seed }}]){const report=JSON.parse(fs.readFileSync('tests/long-run-'+seed+'.json'));assert.equal(report.fingerprint,hash);assert.equal(report.checkpoints.length,30);}
          JS
      - name: Vérifier une sauvegarde longue dans Chromium
        if: matrix.seed == 2026
        run: |
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          else
            npx playwright-core install --with-deps chromium
          fi
          node tools/v34-browser.mjs
          node --input-type=module -e "import fs from 'node:fs';fs.writeFileSync('.qa-cache/v39-long-save.json',JSON.stringify(JSON.parse(fs.readFileSync('.qa-cache/state-2026.json')).state));"
          QA_LONG_SAVE="$PWD/.qa-cache/v39-long-save.json" npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-career-v39-${{ matrix.seed }}
          path: |
            tests/long-run-${{ matrix.seed }}.json
            test-results/
