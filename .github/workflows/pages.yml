name: Publier HOOP LEGACY
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Préparer les fichiers publics
        run: |
          mkdir -p _site/dist
          cp -R dist/. _site/dist/
          cp index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier le jeu
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Vérifier le site publié
        run: |
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          else
            npx playwright-core install --with-deps chromium
          fi
          for attempt in 1 2 3 4; do
            if node tools/public-check.mjs; then exit 0; fi
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-mobile-check
          path: test-results/
